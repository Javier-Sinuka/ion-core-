name: Build and Analyze ION-CORE with SonarQube Cloud

on:
  push:
    branches:
      - main
      - master
      - integration
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-sonar:
    name: Build ION-CORE and scan
    runs-on: ubuntu-latest

    env:
      BUILD_WRAPPER_OUT_DIR: build-wrapper-output

    steps:
      - name: Checkout ION-CORE fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            git \
            make \
            gcc \
            python3 \
            wget \
            curl \
            unzip

      - name: Install Sonar Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v8

      - name: Prepare ION-CORE sources from compatible ION-DTN version
        run: |
          make clean || true
          make distclean || true

          # Sin argumento: extract.sh descarga la versión ION-DTN esperada por este ion-core.
          ./scripts/extract.sh

          echo "Checking generated headers..."
          ls -la inc | head -80
          test -f inc/ion.h || test -L inc/ion.h

      - name: Build ION-CORE with Build Wrapper
        run: |
          build-wrapper-linux-x86-64 \
            --out-dir "$BUILD_WRAPPER_OUT_DIR" \
            bash -c 'make && make static && make shared'

          test -s "$BUILD_WRAPPER_OUT_DIR/compile_commands.json"

      - name: Show Build Wrapper output files
        if: always()
        run: |
          ls -la "$BUILD_WRAPPER_OUT_DIR" || true
          test -f "$BUILD_WRAPPER_OUT_DIR/build-wrapper.log" && tail -200 "$BUILD_WRAPPER_OUT_DIR/build-wrapper.log" || true
          test -f "$BUILD_WRAPPER_OUT_DIR/compile_commands.json" && head -40 "$BUILD_WRAPPER_OUT_DIR/compile_commands.json" || true

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}